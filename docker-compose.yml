services:
  ollama:
    image: ${DOCKER_REGISTRY}${DOCKER_REGISTRY:+:}${DOCKER_REGISTRY_PULL_PORT}${DOCKER_REGISTRY_PULL_PORT:+/}ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ${VOLUME_OLLAMA:-ollama_data}:/root/.ollama

  reviewer:
    image: ${DOCKER_REGISTRY}${DOCKER_REGISTRY:+:}${DOCKER_REGISTRY_PUSH_PORT}${DOCKER_REGISTRY_PUSH_PORT:+/}dba/reviewer-db-ia
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}${DOCKER_REGISTRY:+:}${DOCKER_REGISTRY_PULL_PORT}
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    # El comando lo define el CMD del Dockerfile (python run.py): run.py es la única
    # fuente del mapeo env-var -> flag del CLI, tanto local como en contenedor.
    # Acá solo se pasan al contenedor las variables que run.py consume.
    environment:
      PROVIDER: ${PROVIDER:-ollama}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_AGENT: ${MODEL_AGENT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:-}
      SKIP_REPORTER: ${SKIP_REPORTER:-}
      REVIEWER_TEMPERATURE: ${REVIEWER_TEMPERATURE:-}
      REVIEWER_MAX_CONCURRENCY: ${REVIEWER_MAX_CONCURRENCY:-}
      REVIEWER_MAX_SCHEMA_SCRIPTS: ${REVIEWER_MAX_SCHEMA_SCRIPTS:-0}
      # sin default acá: si no está seteado, el default (CRÍTICO) lo pone src/main.py
      REVIEWER_FAIL_ON: ${REVIEWER_FAIL_ON:-}
      REVIEWER_LLM_TIMEOUT: ${REVIEWER_LLM_TIMEOUT:-120}
      REVIEWER_LLM_RETRIES: ${REVIEWER_LLM_RETRIES:-2}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-}
      REVIEWER_SARIF: ${REVIEWER_SARIF:-}
    volumes:
      - ${REVIEW_SCRIPTS_PATH}:/app/scripts_review


volumes:
  ollama_data:
