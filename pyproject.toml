[project]
name = "reviewer-db-ia"
version = "0.1.0"
description = "Reviewer DB Agent"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-ollama",
    "langchain-openai",
    "langgraph",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
